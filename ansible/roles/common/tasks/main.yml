---
- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
      - acl
      - curl
    state: present
    update_cache: true

- name: Créer l'utilisateur système du service
  ansible.builtin.user:
    name: appsvc
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/appsvc     # Ansible y place ses fichiers temporaires
    create_home: true
