# Par défaut : tout est interdit. Puis on autorise uniquement ce qui est nécessaire.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: devops-lab
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress
  namespace: devops-lab
spec:
  podSelector:
    matchLabels:
      app: devops-lab
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
