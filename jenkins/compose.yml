services:
  jenkins:
    build: .
    image: jenkins-lab:lts
    container_name: jenkins-lab
    user: root                  # voir README : nécessaire pour accéder au socket Docker
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
